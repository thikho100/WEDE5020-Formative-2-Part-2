<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Kulani's Dentistry - Staff Login</title>
</head>
<body>
    <table border="1" width="100%" cellspacing="0" cellpadding="20">
        <tr>
            <td align="center">
                <img src="picture8.png" alt="Tooth logo" width="70">
                <h1>Kulani's Dentistry</h1>
            </td>
            <td align="center">
                <a href="index.html">BACK TO HOME</a>
            </td>
        </tr>
        <tr>
            <td align="center" colspan="2">
                <h1>Staff Login</h1>
                <p>Only authorised clinic staff may continue.</p>
            </td>
        </tr>
        <tr>
            <td colspan="2">
                <form action="admin.html" method="get">
                    <label for="username">Username:</label>
                    <input type="text" id="username" name="username" size="40">
                    <br><br>

                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" size="40">
                    <br><br>

                    <input type="submit" value="LOGIN">
                </form>
                <p>Forgot your password? Contact the clinic manager.</p>
            </td>
        </tr>
    </table>
</body>
</html>
